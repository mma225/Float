\
name: Build NusaRebuilt Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Find project and install dependencies
        shell: pwsh
        run: |
          $main = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "main.py" -File -Recurse |
            Where-Object { $_.FullName -notmatch '\\(\\.git|\\.venv|venv|build|dist)\\' } |
            Select-Object -First 1

          if (-not $main) {
            Write-Error "Tidak menemukan main.py. Pastikan source Nusa ikut di-upload ke repository."
            exit 1
          }

          $projectDir = $main.Directory.FullName
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MAIN_FILE=$($main.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          $requirements = Join-Path $projectDir "requirements.txt"
          python -m pip install --upgrade pip
          if (Test-Path $requirements) {
            python -m pip install -r $requirements
          } else {
            Write-Error "requirements.txt tidak ditemukan di folder yang sama dengan main.py."
            exit 1
          }
          python -m pip install pyinstaller

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name NusaRebuilt `
            --collect-all PySide6 `
            --distpath "$env:GITHUB_WORKSPACE\dist" `
            --workpath "$env:GITHUB_WORKSPACE\build" `
            --specpath "$env:GITHUB_WORKSPACE" `
            "$env:MAIN_FILE"

      - name: Check EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\dist\NusaRebuilt.exe")) {
            Write-Error "NusaRebuilt.exe tidak ditemukan setelah proses build."
            exit 1
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NusaRebuilt-Windows11-EXE
          path: dist/NusaRebuilt.exe
          if-no-files-found: error
